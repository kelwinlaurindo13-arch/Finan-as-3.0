<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="theme-color" content="#0B0716">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Minhas Finanças</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --txt:#FBFAFF; --txt2:#B4AECB; --txt3:#7E7796;
  --pp:#A594F5; --pp2:#7B68E8; --gr:#5FE3B0; --or:#FFB86C; --rd:#FF9CB0; --bl:#7DC4FF;
  --g-bg:rgba(255,255,255,.07);
  --g-bg2:rgba(255,255,255,.045);
  --g-br:rgba(255,255,255,.14);
  --g-hl:inset 0 1px 0 rgba(255,255,255,.30), inset 0 -1px 0 rgba(255,255,255,.05);
  --g-sh:0 8px 32px rgba(0,0,0,.28);
  --blur:blur(34px) saturate(190%);
  --r:24px;
}
html{background:#0B0716}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;color:var(--txt);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;max-width:470px;margin:0 auto;position:relative;background:transparent}

/* ── AURORA BACKDROP ── */
#aur{position:fixed;inset:0;z-index:0;overflow:hidden;background:#0B0716}
#aur i{position:absolute;display:block;border-radius:50%;filter:blur(80px);opacity:.62}
#aur i:nth-child(1){width:120%;height:56%;top:-18%;left:-30%;background:radial-gradient(circle,#7B4DE8,transparent 66%)}
#aur i:nth-child(2){width:95%;height:46%;top:8%;right:-42%;background:radial-gradient(circle,#C44BC8,transparent 68%);opacity:.42}
#aur i:nth-child(3){width:110%;height:50%;bottom:-14%;left:-34%;background:radial-gradient(circle,#2E9BD8,transparent 68%);opacity:.36}
#aur i:nth-child(4){width:80%;height:38%;bottom:6%;right:-26%;background:radial-gradient(circle,#20C79A,transparent 70%);opacity:.24}
#aur i:nth-child(5){width:70%;height:32%;top:42%;left:12%;background:radial-gradient(circle,#FF9A5C,transparent 72%);opacity:.16}
#aur::after{content:'';position:absolute;inset:0;background:rgba(8,5,18,.42)}

/* ── GLASS ── */
.g{background:var(--g-bg);border:1px solid var(--g-br);border-radius:var(--r);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);box-shadow:var(--g-hl),var(--g-sh);position:relative;overflow:hidden}
.g::before{content:'';position:absolute;top:0;left:0;right:0;height:44%;background:linear-gradient(180deg,rgba(255,255,255,.10),transparent);pointer-events:none;border-radius:var(--r) var(--r) 0 0}
.g2{background:var(--g-bg2);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}

/* ── AUTH ── */
#auth{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:28px;position:relative;z-index:2}
.a-mark{font-size:31px;font-weight:800;letter-spacing:-1.3px;margin-bottom:5px;text-shadow:0 2px 24px rgba(165,148,245,.4)}
.a-sub{color:rgba(255,255,255,.5);font-size:10.5px;letter-spacing:2.4px;text-transform:uppercase;margin-bottom:42px}
.a-card{padding:28px 24px;width:100%;max-width:360px}
.a-card h2{font-size:21px;font-weight:700;margin-bottom:4px;letter-spacing:-.5px}
.a-card p{font-size:13px;color:var(--txt2);margin-bottom:22px}
.fld{margin-bottom:14px;position:relative;z-index:1}
.fld label{display:block;font-size:10px;font-weight:700;color:var(--txt3);margin-bottom:7px;text-transform:uppercase;letter-spacing:1.1px}
.inp{width:100%;padding:14px 16px;border:1px solid rgba(255,255,255,.13);border-radius:15px;font-size:15px;outline:none;background:rgba(255,255,255,.06);color:var(--txt);transition:.2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.12);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);appearance:none}
.inp:focus{border-color:rgba(165,148,245,.6);background:rgba(165,148,245,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 0 4px rgba(165,148,245,.12)}
.inp::placeholder{color:rgba(255,255,255,.28)}
.btn{width:100%;padding:16px;border:1px solid rgba(255,255,255,.22);border-radius:16px;font-size:15px;font-weight:700;cursor:pointer;transition:.18s;color:#fff;background:linear-gradient(150deg,rgba(165,148,245,.55),rgba(123,104,232,.45));backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,.34),0 6px 22px rgba(123,104,232,.32);position:relative;z-index:1}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.5}
.a-err{background:rgba(255,156,176,.14);color:var(--rd);padding:11px 14px;border-radius:13px;font-size:12.5px;margin-bottom:14px;border:1px solid rgba(255,156,176,.24);display:none;position:relative;z-index:1}
.a-sw{text-align:center;margin-top:18px;font-size:13px;color:var(--txt2);position:relative;z-index:1}
.a-sw span{color:var(--pp);font-weight:700;cursor:pointer}

/* ── APP ── */
#app{display:none;position:relative;z-index:2;padding-bottom:108px}
.hd{padding:calc(env(safe-area-inset-top) + 14px) 18px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.greet{font-size:13px;color:var(--txt2);margin-bottom:1px}
.title{font-size:26px;font-weight:800;letter-spacing:-1px;line-height:1.08;text-shadow:0 2px 18px rgba(0,0,0,.28)}
.hd-r{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-top:5px}
.mnav{display:flex;align-items:center;gap:1px;border-radius:16px;padding:4px 5px}
.mnav button{background:none;border:none;color:var(--txt2);width:27px;height:29px;font-size:17px;cursor:pointer;border-radius:11px;display:flex;align-items:center;justify-content:center;transition:.15s;position:relative;z-index:1}
.mnav button:active{background:rgba(255,255,255,.13);color:#fff}
.mnav span{font-size:13.5px;font-weight:700;padding:0 5px;letter-spacing:-.2px;white-space:nowrap;position:relative;z-index:1}
.ib{width:39px;height:39px;border-radius:14px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:.15s}
.ib:active{transform:scale(.94)}
.ib svg{width:17px;height:17px;stroke:var(--txt);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;position:relative;z-index:1;opacity:.9}

.wrap{padding:0 16px}
.card{padding:19px;margin-bottom:13px}
.c-lbl{font-size:15.5px;font-weight:700;letter-spacing:-.35px;margin-bottom:15px;position:relative;z-index:1}
.rel{position:relative;z-index:1}

/* HERO */
.hero{padding:21px;margin-bottom:13px;background:linear-gradient(155deg,rgba(165,148,245,.20),rgba(255,255,255,.05));border-color:rgba(255,255,255,.18)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;position:relative;z-index:1}
.hero-l{font-size:13.5px;color:rgba(255,255,255,.66);margin-bottom:3px}
.hero-v{font-size:41px;font-weight:800;letter-spacing:-2.1px;line-height:1.04;text-shadow:0 2px 20px rgba(0,0,0,.3)}
.hero-v small{font-size:21px;font-weight:700;letter-spacing:-.6px;opacity:.82}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:22px;padding:6px 13px;font-size:12.5px;font-weight:600;margin-top:12px;border:1px solid;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.c-dn{background:rgba(255,156,176,.16);border-color:rgba(255,156,176,.26);color:var(--rd)}
.c-up{background:rgba(95,227,176,.15);border-color:rgba(95,227,176,.26);color:var(--gr)}
.c-nt{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.14);color:var(--txt2)}
.ring{position:relative;width:106px;height:106px;flex-shrink:0}
.ring svg{transform:rotate(-90deg);filter:drop-shadow(0 0 10px currentColor)}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-n{font-size:24px;font-weight:800;letter-spacing:-.9px;line-height:1}
.ring-n span{font-size:12px;font-weight:700}
.ring-t{font-size:8.5px;color:rgba(255,255,255,.5);letter-spacing:1.4px;font-weight:700;margin-top:3px}
.pills{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:19px;position:relative;z-index:1}
.pl{border-radius:16px;padding:11px 12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.16);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.pl.hl{background:rgba(95,227,176,.13);border-color:rgba(95,227,176,.26)}
.pl-l{font-size:10.5px;color:rgba(255,255,255,.6);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl.hl .pl-l{color:var(--gr)}
.pl-v{font-size:15px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.pl.hl .pl-v{color:var(--gr)}

/* BARRAS */
.fp-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.fp-t{font-size:15px;font-weight:700;letter-spacing:-.3px}
.fp-v{font-size:16.5px;font-weight:800;color:var(--or);letter-spacing:-.4px}
.pbar{height:8px;background:rgba(255,255,255,.09);border-radius:10px;overflow:hidden;box-shadow:inset 0 1px 2px rgba(0,0,0,.2)}
.pfill{height:100%;border-radius:10px;transition:width .6s cubic-bezier(.4,0,.2,1);box-shadow:0 0 12px rgba(255,255,255,.3)}
.fp-sub{display:flex;justify-content:space-between;margin-top:10px;font-size:11.5px;color:var(--txt3)}

/* PARCEIRO */
.pt{padding:19px;margin-bottom:13px;cursor:pointer;background:linear-gradient(145deg,rgba(196,75,200,.22),rgba(123,104,232,.16));border-color:rgba(255,255,255,.17)}
.pt-tag{font-size:10px;font-weight:800;letter-spacing:1.5px;color:rgba(255,255,255,.62);text-transform:uppercase;display:flex;align-items:center;gap:7px;margin-bottom:10px;position:relative;z-index:1}
.pt-tag::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gr);box-shadow:0 0 10px var(--gr)}
.pt-h{font-size:17px;font-weight:700;letter-spacing:-.45px;margin-bottom:15px;line-height:1.35;position:relative;z-index:1}
.pt-g{display:flex;gap:30px;position:relative;z-index:1}
.pt-l{font-size:11px;color:rgba(255,255,255,.55);margin-bottom:2px}
.pt-v{font-size:17.5px;font-weight:800;letter-spacing:-.5px}
.pt-b{display:inline-block;background:rgba(255,156,176,.18);border:1px solid rgba(255,156,176,.24);border-radius:22px;padding:6px 14px;font-size:11.5px;color:#FFB3C2;margin-top:14px;position:relative;z-index:1}
.pt-r{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:13px;color:#fff;font-size:11.5px;font-weight:700;padding:8px 15px;cursor:pointer;margin-top:14px;margin-left:8px;position:relative;z-index:1;backdrop-filter:blur(12px);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}

/* STATS */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.st{padding:16px;border-radius:20px}
.st svg{width:20px;height:20px;fill:none;stroke-width:1.85;stroke-linecap:round;stroke-linejoin:round;margin-bottom:12px;display:block;position:relative;z-index:1}
.st-l{font-size:11.5px;color:var(--txt2);margin-bottom:3px;position:relative;z-index:1}
.st-v{font-size:19.5px;font-weight:800;letter-spacing:-.65px;position:relative;z-index:1}

/* SEGMENT */
.seg{display:flex;border-radius:17px;padding:4px;margin-bottom:14px;position:relative}
.seg button{flex:1;padding:11px;background:none;border:none;color:var(--txt2);font-size:13.5px;font-weight:600;border-radius:13px;cursor:pointer;transition:.22s;position:relative;z-index:1}
.seg button.on{background:rgba(255,255,255,.15);color:#fff;font-weight:700;box-shadow:inset 0 1px 0 rgba(255,255,255,.28),0 2px 10px rgba(0,0,0,.16)}

/* RESTA */
.rst{padding:19px;margin-bottom:13px}
.rst-pp{background:linear-gradient(150deg,rgba(165,148,245,.24),rgba(255,255,255,.05))}
.rst-or{background:linear-gradient(150deg,rgba(255,184,108,.20),rgba(255,255,255,.05))}
.rst-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;position:relative;z-index:1}
.rst-l{font-size:13.5px;color:rgba(255,255,255,.68)}
.rst-p{font-size:12.5px;color:rgba(255,255,255,.55)}
.rst-v{font-size:33px;font-weight:800;letter-spacing:-1.6px;margin-bottom:15px;position:relative;z-index:1;text-shadow:0 2px 16px rgba(0,0,0,.26)}
.rst-s{display:flex;justify-content:space-between;margin-top:10px;font-size:11.5px;color:rgba(255,255,255,.5);position:relative;z-index:1}

/* LISTA */
.lst{overflow:hidden;margin-bottom:13px}
.li{display:flex;align-items:center;gap:13px;padding:15px 17px;border-bottom:1px solid rgba(255,255,255,.06);position:relative;z-index:1}
.li:last-child{border-bottom:none}
.ck{width:28px;height:28px;border-radius:10px;border:1.6px solid rgba(255,255,255,.24);background:rgba(255,255,255,.05);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.22s;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.ck.on{background:rgba(95,227,176,.22);border-color:var(--gr);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 0 12px rgba(95,227,176,.28)}
.ck svg{width:14px;height:14px;stroke:var(--gr);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:.22s;transform:scale(.6)}
.ck.on svg{opacity:1;transform:scale(1)}
.li-i{flex:1;min-width:0}
.li-n{font-size:15px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.pd .li-n{text-decoration:line-through;color:var(--txt3);font-weight:500}
.li-s{font-size:11.5px;color:var(--txt3);margin-top:1px}
.li-v{font-size:15px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.li.pd .li-v{color:var(--txt3);font-weight:600}
.ed{width:33px;height:33px;border-radius:11px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.11);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.ed:active{transform:scale(.9)}
.ed svg{width:14px;height:14px;stroke:var(--txt2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.li-a{display:flex;gap:6px;flex-shrink:0}
.del{background:rgba(255,156,176,.09);border-color:rgba(255,156,176,.18)}
.del svg{stroke:var(--rd)}

/* CATEGORIA */
.cg{overflow:hidden;margin-bottom:13px}
.cg-h{display:flex;align-items:center;gap:10px;padding:15px 17px;border-bottom:1px solid rgba(255,255,255,.06);position:relative;z-index:1}
.cg-d{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cg-n{font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.cg-t{margin-left:auto;font-size:14.5px;font-weight:800;letter-spacing:-.3px}

/* COFRE */
.cf{padding:18px;margin-bottom:12px}
.cf-t{display:flex;gap:15px;align-items:center;margin-bottom:15px;position:relative;z-index:1}
.cr{width:58px;height:58px;position:relative;flex-shrink:0}
.cr svg{transform:rotate(-90deg);filter:drop-shadow(0 0 8px rgba(95,227,176,.5))}
.cr-n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;letter-spacing:-.4px}
.cf-i{flex:1;min-width:0}
.cf-n{font-size:17px;font-weight:700;letter-spacing:-.45px;margin-bottom:3px}
.cf-s{font-size:13px;color:var(--txt2)}
.cf-p{font-size:12.5px;color:var(--gr);margin-top:3px}
.cf-b{display:flex;gap:9px;position:relative;z-index:1}
.cf-b button{padding:12px;border-radius:14px;font-size:13.5px;font-weight:700;cursor:pointer;border:1px solid;transition:.15s;backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.cf-b button:active{transform:scale(.97)}
.cf-g{flex:1;background:rgba(165,148,245,.20);border-color:rgba(165,148,245,.34);color:#C9BCFF}
.cf-x{background:rgba(255,255,255,.05);border-color:rgba(255,255,255,.12);color:var(--txt2);padding-left:20px;padding-right:20px}

/* ANALÍTICO */
.ins{padding:20px;margin-bottom:13px;background:linear-gradient(150deg,rgba(165,148,245,.20),rgba(196,75,200,.10))}
.ins-t{font-size:10px;font-weight:800;letter-spacing:1.6px;color:#C9BCFF;text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:15px;position:relative;z-index:1}
.ins-t svg{width:14px;height:14px;stroke:#C9BCFF;fill:none;stroke-width:1.9;stroke-linecap:round}
.ins-h{font-size:20.5px;font-weight:700;letter-spacing:-.65px;line-height:1.4;position:relative;z-index:1}
.ins-d{height:1px;background:rgba(255,255,255,.13);margin:17px 0;position:relative;z-index:1}
.ins-b{font-size:14px;color:var(--txt2);line-height:1.68;position:relative;z-index:1}
.ins-b b{color:var(--txt);font-weight:700}

.hbar{display:flex;gap:4px;height:46px;margin-bottom:15px;position:relative;z-index:1}
.hseg{border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:rgba(0,0,0,.5);min-width:6px;transition:.5s;box-shadow:inset 0 1px 0 rgba(255,255,255,.34)}
.hleg{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px;position:relative;z-index:1}
.hl-i{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt2)}
.hl-d{width:9px;height:9px;border-radius:3px;flex-shrink:0}

.dn-w{display:flex;align-items:center;gap:18px;position:relative;z-index:1}
.dn-c{position:relative;width:134px;height:134px;flex-shrink:0}
.dn-i{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dn-t{font-size:9px;color:var(--txt3);letter-spacing:1.5px;font-weight:700}
.dn-v{font-size:17px;font-weight:800;letter-spacing:-.6px;margin-top:3px}
.dn-l{flex:1;display:flex;flex-direction:column;gap:11px;min-width:0}
.dn-r{display:flex;align-items:center;gap:9px;font-size:13.5px}
.dn-d{width:9px;height:9px;border-radius:50%;flex-shrink:0;box-shadow:0 0 8px currentColor}
.dn-nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dn-pc{font-weight:700;font-size:13px;color:var(--txt2);white-space:nowrap}
.dn-pc.up{color:var(--rd)}
.dn-pc.dw{color:var(--gr)}

.emp{text-align:center;padding:46px 22px;color:var(--txt3);font-size:14px;line-height:1.7;position:relative;z-index:1}
.emp svg{width:36px;height:36px;stroke:var(--txt3);fill:none;stroke-width:1.4;margin-bottom:15px;opacity:.5}

/* FAB */
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 100px);right:20px;width:56px;height:56px;border-radius:21px;border:1px solid rgba(255,255,255,.26);color:#fff;font-size:28px;font-weight:300;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:60;transition:.18s;background:linear-gradient(150deg,rgba(165,148,245,.6),rgba(123,104,232,.5));backdrop-filter:blur(22px) saturate(190%);-webkit-backdrop-filter:blur(22px) saturate(190%);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 32px rgba(123,104,232,.4)}
.fab:active{transform:scale(.9)}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:470px;display:flex;padding:9px 10px calc(env(safe-area-inset-bottom) + 9px);z-index:70;gap:3px;background:rgba(255,255,255,.07);border-top:1px solid rgba(255,255,255,.14);backdrop-filter:blur(40px) saturate(200%);-webkit-backdrop-filter:blur(40px) saturate(200%);box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 3px;background:none;border:none;color:var(--txt3);font-size:10px;font-weight:600;cursor:pointer;border-radius:16px;transition:.22s}
.nv.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.26)}

document.getElementById('a-tg').onclick=()=>{isReg=!isReg;

async function doAuth(){
 const em=document.getElementById('a-em').value.trim(),pw=document.getElementById('a-pw').value,er=document.getElementById('a-err');
 er.style.display='none';
 if(!em||!pw){er.textContent='Preencha e-mail e senha.';er.style.display='block';return;}
 const b=document.getElementById('a-bt');b.disabled=true;b.textContent='Aguarde...';
 try{if(isReg)await auth.createUserWithEmailAndPassword(em,pw);else await auth.signInWithEmailAndPassword(em,pw);}
 catch(e){er.textContent=ERRS[e.code]||('Erro: '+e.message);er.style.display='block';b.disabled=false;b.textContent=isReg?'Criar conta':'Entrar';}
}
auth.onAuthStateChanged(async u=>{
 if(u){uid=u.uid;
  try{const s=await db.collection('users').doc(uid).get();if(s.exists)U={nome:'',salario:0,spouseUid:'',spouseName:'Parceiro(a)',cofrinhos:[],months:{},...s.data()};}catch(e){console.error(e);}
  if(!U.nome)U.nome=(u.email||'').split('@')[0].replace(/[._]/g,' ').split(' ')[0].replace(/^./,c=>c.toUpperCase());
  U.email=u.email;propag();save();
  document.getElementById('auth').style.display='none';
  document.getElementById('app').style.display='block';
  render();if(U.spouseUid)fetchP();
 }else{
  document.getElementById('auth').style.display='flex';
  document.getElementById('app').style.display='none';
  const b=document.getElementById('a-bt');b.disabled=false;b.textContent=isReg?'Criar conta':'Entrar';
 }
});

function vCofres(md){
 const cfs=U.cofrinhos||[];
 if(!cfs.length)return`<div class="lst g"><div class="emp">${svg(I.gift)}Nenhum cofrinho ainda.<br>Toque no + para criar seu primeiro objetivo.</div></div>`;
 const totG=cfs.reduce((s,c)=>s+totalCof(c.id),0);
 const mesG=md.aportes.reduce((s,a)=>s+Number(a.valor),0);
 let proj='';
 if(mesG>0){const alvo=cfs.reduce((b,c)=>{const t=totalCof(c.id),falta=Number(c.meta)-t;return(falta>0&&(!b||falta<b.falta))?{c,falta}:b;},null);
  if(alvo){const ms=Math.ceil(alvo.falta/mesG);proj=`No ritmo de ${MN[cM-1].toLowerCase()} (${fmtS(mesG)}/mês), <b style="color:var(--gr)">${esc(alvo.c.nome)}</b> fecha em <b style="color:var(--gr)">${ms} ${ms===1?'mês':'meses'}</b>.`;}
  else proj='Todas as metas já foram batidas. 🎉';}
 else proj='Guarde algo esse mês para ver a projeção de quando cada meta fecha.';
 return`

  </div>
 </div>
 ${cfs.map(c=>{const t=totalCof(c.id),pct=c.meta>0?Math.min(100,Math.round(t/c.meta*100)):0;
  const R=24,CC=2*Math.PI*R,falta=Number(c.meta)-t;
  const ms=mesG>0&&falta>0?Math.ceil(falta/mesG):0;
  return`<div class="cf g">
   <div class="cf-t">
    <div class="cr"><svg width="58" height="58">
      <circle cx="29" cy="29" r="${R}" stroke="rgba(255,255,255,.11)" stroke-width="5" fill="none"/>
      <circle cx="29" cy="29" r="${R}" stroke="#5FE3B0" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="${CC}" stroke-dashoffset="${CC*(1-pct/100)}"/>

     ${pct>=100?`<div class="cf-p">Meta batida! 🎉</div>`:ms?`<div class="cf-p">faltam ${ms} ${ms===1?'mês':'meses'} no ritmo atual</div>`:''}

  </div>`;}).join('')}`;
}
function totalCof(id){let t=Number((U.cofrinhos.find(c=>c.id===id)||{}).total||0);
 Object.values(U.months).forEach(m=>(m.aportes||[]).forEach(a=>{if(a.cofId===id)t+=Number(a.valor);}));return t;}

 const anual=aFilt==='ano';
 const cats=catData(anual),prev=catData(false,cM===1?12:cM-1,cM===1?cY-1:cY);
 const tot=Object.values(cats).reduce((s,v)=>s+v,0);
 const ord=Object.entries(cats).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
 _dn=ord;
 const pk=key(cM===1?cY-1:cY,cM===1?12:cM-1),pv=U.months[pk];
 let h1='Comece a registrar para ver os insights.',bd='Assim que houver dados de dois meses, o resumo aparece aqui.';
 if(anual){
  const yr=Array.from({length:12},(_,i)=>calc(U.months[key(cY,i+1)]||{},U.salario)).filter(x=>x.tot>0);
  const mdd=yr.length?yr.reduce((s,x)=>s+x.tot,0)/yr.length:0;
  const eco=yr.reduce((s,x)=>s+x.saldo,0);
  h1=`Em ${cY} você gastou ${fmtS(mdd)} por mês, em média.`;
  bd=`Somando os ${yr.length} ${yr.length===1?'mês registrado':'meses registrados'}, sobrou <b>${fmt(eco)}</b>. O maior grupo do ano foi <b>${ord[0]?ord[0][0]:'—'}</b> com ${ord[0]?fmt(ord[0][1]):'R$ 0'}.`;
 }else if(pv){
  const pc=calc(pv,U.salario),d=c.saldo-pc.saldo;
  const subs=ord.map(([k,v])=>({k,v,d:v-(prev[k]||0)})).filter(x=>x.d>1).sort((a,b)=>b.d-a.d).slice(0,2);
  const pm=MN[(cM===1?12:cM-1)-1].toLowerCase();
  h1=d<0?`${MN[cM-1]} ficou ${fmt(Math.abs(d))} mais apertado que ${pm}${subs.length?` — e quase tudo veio de ${subs.map(s=>s.k.toLowerCase()).join(' e ')}.`:'.'}`
        :`${MN[cM-1]} sobrou ${fmt(Math.abs(d))} a mais que ${pm}.`;
  const nfF=md.fixas.filter(f=>!md.pagos[f.id]).reduce((s,f)=>s+Number(f.valor),0);
  bd=(subs.length?subs.map(s=>`<b>${s.k}</b> subiu ${fmtS(s.d)}`).join(' e ')+'. ':'Nenhuma categoria disparou. ')
   +(nfF>0?`Ainda faltam <b>${fmt(nfF)}</b> de fixas — já estão contadas no saldo.`:'Todas as fixas do mês já estão quitadas.');
 }
 const parts=[{l:'Fixas',v:c.fT,c:'#A594F5'},{l:'Variáveis',v:c.vT,c:'#FFB86C'},{l:'Guardado',v:c.aT,c:'#5FE3B0'},{l:'Sobrou',v:Math.max(0,c.saldo),c:'#8E86A8'}];
 const base=parts.reduce((s,p)=>s+p.v,0)||1;
 return`
 <div class="seg g"><button class="${!anual?'on':''}" onclick="setF('mes')">${MN[cM-1]}</button><button class="${anual?'on':''}" onclick="setF('ano')">Últimos 12 meses</button></div>
 <div class="ins g">
  <div class="ins-t">${svg(I.spark)}O resumo em uma frase</div>
  <div class="ins-h">${h1}</div>
  <div class="ins-d"></div>
  <div class="ins-b">${bd}</div>
 </div>
 ${!anual?`<div class="card g">
  <div class="c-lbl">Para onde vai cada R$ 100</div>
  <div class="hbar">${parts.filter(p=>p.v>0).map(p=>{const pc=p.v/base*100;return`<div class="hseg" style="flex:${pc};background:${p.c}">${pc>=9?Math.round(pc):''}</div>`;}).join('')}</div>
  <div class="hleg">${parts.map(p=>`<div class="hl-i"><span class="hl-d" style="background:${p.c}"></span>${p.l} — ${hvs(p.v)}</div>`).join('')}</div>
 </div>`:''}
 <div class="card g">
  <div class="c-lbl">Onde o dinheiro foi</div>
  <div class="dn-w">
   <div class="dn-c"><svg id="dn" width="134" height="134" viewBox="0 0 134 134"></svg>
    <div class="dn-i"><div class="dn-t">TOTAL</div><div class="dn-v">${hvs(tot)}</div></div></div>
   <div class="dn-l">${ord.slice(0,6).map(([k,v])=>{
     const pc=tot?Math.round(v/tot*100):0,pd=prev[k]||0;
     const tr=!anual&&pd>0?(v>pd*1.08?'up':v<pd*0.92?'dw':''):'';
     return`<div class="dn-r"><span class="dn-d" style="background:${col(k)};color:${col(k)}"></span><span class="dn-nm">${k}</span><span class="dn-pc ${tr}">${pc}%${tr==='up'?' ▲':tr==='dw'?' ▼':''}</span></div>`;}).join('')}
    ${ord.length>6?`<div class="dn-r"><span class="dn-d" style="background:#6B647F"></span><span class="dn-nm" style="color:var(--txt2)">Outras ${ord.length-6} categorias</span><span class="dn-pc">${Math.round(ord.slice(6).reduce((s,[,v])=>s+v,0)/(tot||1)*100)}%</span></div>`:''}
   </div>
  </div>
 </div>
 ${anual?`<div class="card g"><div class="c-lbl">Mês a mês em ${cY}</div>
  <div class="rel" style="display:flex;gap:5px;align-items:flex-end;height:132px;margin-bottom:12px">
   ${(()=>{const arr=Array.from({length:12},(_,i)=>calc(U.months[key(cY,i+1)]||{},U.salario));
    const mx=Math.max(1,...arr.map(a=>a.tot));
    return arr.map((a,i)=>`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px">
     <div style="width:100%;height:104px;display:flex;flex-direction:column-reverse;border-radius:7px;overflow:hidden;background:rgba(255,255,255,.06)">
      <div style="height:${a.fT/mx*104}px;background:#A594F5"></div>
      <div style="height:${a.vT/mx*104}px;background:#FFB86C"></div>
      <div style="height:${a.aT/mx*104}px;background:#5FE3B0"></div>
     </div>
     <span style="font-size:9px;color:${i+1===cM?'#C9BCFF':'var(--txt3)'};font-weight:${i+1===cM?800:600}">${MS[i]}</span>
    </div>`).join('');})()}
  </div>
  <div class="hleg"><div class="hl-i"><span class="hl-d" style="background:#A594F5"></span>Fixas</div><div class="hl-i"><span class="hl-d" style="background:#FFB86C"></span>Variáveis</div><div class="hl-i"><span class="hl-d" style="background:#5FE3B0"></span>Guardado</div></div>
 </div>`:''}`;
}
function catData(anual,m,y){
 const cats={};
 const proc=md=>{
  (md.variaveis||[]).forEach(v=>{const c=catVar(v.nome,v.categoria);cats[c]=(cats[c]||0)+Number(v.valor);});
  (md.fixas||[]).forEach(f=>{const g=grpFixa(f.nome);cats[g]=(cats[g]||0)+Number(f.valor);});
  const a=(md.aportes||[]).reduce((s,x)=>s+Number(x.valor),0);if(a>0)cats['Cofrinhos']=(cats['Cofrinhos']||0)+a;
 };
 if(anual){for(let i=1;i<=12;i++){const d=U.months[key(cY,i)];if(d)proc(d);}}
 else{const d=U.months[key(y||cY,m||cM)];if(d)proc(d);}
 return cats;
}
function drawDonut(){
 const el=document.getElementById('dn');if(!el)return;
 const tot=_dn.reduce((s,[,v])=>s+v,0)||1;
 const R=53,W=13,cx=67,cy=67,C=2*Math.PI*R;
 let off=0,h=`<circle cx="${cx}" cy="${cy}" r="${R}" stroke="rgba(255,255,255,.07)" stroke-width="${W}" fill="none"/>`;
 _dn.forEach(([k,v])=>{const fr=v/tot;
  h+=`<circle cx="${cx}" cy="${cy}" r="${R}" stroke="${col(k)}" stroke-width="${W}" fill="none" stroke-dasharray="${fr*C-2.5} ${C}" stroke-dashoffset="${-off*C}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="round"/>`;
  off+=fr;});
 el.innerHTML=h;
}

async function fetchP(){
 if(!U.spouseUid)return;toast('Atualizando...');
 try{const s=await db.collection('users').doc(U.spouseUid).get();pData=s.exists?s.data():null;render();toast(pData?'Dados atualizados':'Usuário não encontrado');}
 catch(e){console.error(e);toast('Erro ao atualizar');}
}
function openPartner(){
 if(!pData){toast('Toque em Atualizar primeiro');return;}
 const md=(pData.months||{})[key()]||{},c=calc(md,pData.salario||0);
 document.getElementById('pt-tt').textContent='Finanças da '+(U.spouseName||'Parceiro(a)');
 let h=`<div class="sg" style="grid-template-columns:1fr 1fr;margin-bottom:14px">
  <div class="st g"><div class="st-l">Saldo</div><div class="st-v">${fmt(c.saldo)}</div></div>
  <div class="st g"><div class="st-l">Gastos</div><div class="st-v">${fmt(c.tot)}</div></div></div>`;
 if((md.fixas||[]).length){h+=`<div class="c-lbl" style="margin-top:8px">Contas fixas</div><div class="lst g">`;
  md.fixas.forEach(f=>{const p=!!(md.pagos||{})[f.id];
   h+=`<div class="li ${p?'pd':''}"><div class="ck ${p?'on':''}" style="cursor:default">${svg(I.chk)}</div><div class="li-i"><div class="li-n">${esc(f.nome)}</div><div class="li-s">${p?'Pago':'Ainda não pago'}</div></div><div class="li-v">${fmt(f.valor)}</div></div>`;});
  h+=`</div>`;}
 if((md.variaveis||[]).length){h+=`<div class="c-lbl" style="margin-top:8px">Variáveis</div><div class="lst g">`;
  md.variaveis.forEach(v=>{const p=!!(md.pagosVar||{})[v.id];
   h+=`<div class="li ${p?'pd':''}"><div class="ck ${p?'on':''}" style="cursor:default">${svg(I.chk)}</div><div class="li-i"><div class="li-n">${esc(v.nome)}</div><div class="li-s">${esc(v.categoria||'Outros')}</div></div><div class="li-v">${fmt(v.valor)}</div></div>`;});
  h+=`</div>`;}
 document.getElementById('pt-bd').innerHTML=h;openSh('sh-pt');
}

function go(t){tab=t;render();window.scrollTo(0,0);}
function chM(d){let y=cY,m=cM+d;if(m>12){m=1;y++;}if(m<1){m=12;y--;}if(y<MIN_Y||(y===MIN_Y&&m<MIN_M))return;cY=y;cM=m;propag();render();}
function setF(f){aFilt=f;render();setTimeout(drawDonut,10);}
function toggleHide(){hide=!hide;render();}
function openSh(id){document.getElementById('ov').classList.add('on');document.getElementById(id).classList.add('on');}
function closeSh(){document.getElementById('ov').classList.remove('on');document.querySelectorAll('.sh').forEach(s=>s.classList.remove('on'));}
function openCfg(){
 document.getElementById('cg-nm').value=U.nome||'';
 document.getElementById('cg-sl').value=U.salario||'';
 document.getElementById('cg-sp').value=U.spouseUid||'';
 document.getElementById('cg-sn').value=U.spouseName==='Parceiro(a)'?'':U.spouseName||'';
 document.getElementById('cg-uid').textContent=uid;openSh('sh-cg');}
function saveSettings(){
 U.nome=document.getElementById('cg-nm').value.trim()||U.nome;
 U.salario=parseFloat(document.getElementById('cg-sl').value)||0;
 const ns=document.getElementById('cg-sp').value.trim();
 if(ns!==U.spouseUid)pData=null;
 U.spouseUid=ns;
 U.spouseName=document.getElementById('cg-sn').value.trim()||'Parceiro(a)';
 closeSh();save();render();if(U.spouseUid)fetchP();toast('Configurações salvas');}
function doLogout(){closeSh();auth.signOut();}
function addFixa(){const n=document.getElementById('fx-n').value.trim(),v=parseFloat(document.getElementById('fx-v').value);
 if(!n||isNaN(v)||v<=0){toast('Preencha nome e valor');return;}
 propagNova({seriesId:rid(),nome:n,valor:v});
 document.getElementById('fx-n').value='';document.getElementById('fx-v').value='';
 closeSh();save();render();toast('Conta adicionada');}
function addVar(){const n=document.getElementById('vr-n').value.trim(),v=parseFloat(document.getElementById('vr-v').value),c=document.getElementById('vr-c').value;
 if(!n||isNaN(v)||v<=0){toast('Preencha nome e valor');return;}
 MD().variaveis.push({id:rid(),nome:n,valor:v,categoria:catVar(n,c)});
 document.getElementById('vr-n').value='';document.getElementById('vr-v').value='';
 closeSh();save();render();toast('Gasto adicionado');}
function addCofre(){const n=document.getElementById('cf-n').value.trim(),m=parseFloat(document.getElementById('cf-m').value);
 if(!n||isNaN(m)||m<=0){toast('Preencha nome e meta');return;}
 U.cofrinhos=U.cofrinhos||[];U.cofrinhos.push({id:rid(),nome:n,meta:m,total:0});
 document.getElementById('cf-n').value='';document.getElementById('cf-m').value='';
 closeSh();save();render();toast('Cofrinho criado');}
function openAp(id){document.getElementById('ap-id').value=id;openSh('sh-ap');}
function addAporte(){const id=document.getElementById('ap-id').value,n=document.getElementById('ap-n').value.trim(),v=parseFloat(document.getElementById('ap-v').value);
 if(!n||isNaN(v)||v<=0){toast('Preencha descrição e valor');return;}
 MD().aportes.push({id:rid(),cofId:id,nome:n,valor:v});
 document.getElementById('ap-n').value='';document.getElementById('ap-v').value='';
 closeSh();save();render();toast('Dinheiro guardado');}
function addExtra(){const n=document.getElementById('ex-n').value.trim(),v=parseFloat(document.getElementById('ex-v').value);
 if(!n||isNaN(v)||v<=0){toast('Preencha descrição e valor');return;}
 MD().extras.push({id:rid(),nome:n,valor:v});
 document.getElementById('ex-n').value='';document.getElementById('ex-v').value='';
 closeSh();save();render();toast('Renda extra adicionada');}
function togF(id){const md=MD();md.pagos[id]=!md.pagos[id];save();render();}
function togV(id){const md=MD();md.pagosVar[id]=!md.pagosVar[id];save();render();}
function editF(id){const f=MD().fixas.find(x=>x.id===id);if(!f)return;
 document.getElementById('ef-id').value=id;document.getElementById('ef-n').value=f.nome;document.getElementById('ef-v').value=f.valor;openSh('sh-ef');}
function saveEditFixa(){const id=document.getElementById('ef-id').value,n=document.getElementById('ef-n').value.trim(),v=parseFloat(document.getElementById('ef-v').value);
 if(!n||isNaN(v)||v<=0){toast('Preencha nome e valor');return;}
 const atual=MD().fixas.find(x=>x.id===id);if(!atual)return;
 initFixasGlobais();const t=U.fixasGlobais.find(x=>x.seriesId===atual.seriesId);if(t){t.nome=n;t.valor=v;}
 Object.values(U.months).forEach(md=>(md.fixas||[]).filter(f=>f.seriesId===atual.seriesId).forEach(f=>{f.nome=n;f.valor=v;}));
 closeSh();save();render();toast('Conta atualizada em todos os meses');}
function editV(id){const v=MD().variaveis.find(x=>x.id===id);if(!v)return;
 document.getElementById('ev-id').value=id;document.getElementById('ev-n').value=v.nome;document.getElementById('ev-v').value=v.valor;document.getElementById('ev-c').value=v.categoria||'Outros';openSh('sh-ev');}
function saveEditVar(){const id=document.getElementById('ev-id').value,n=document.getElementById('ev-n').value.trim(),vl=parseFloat(document.getElementById('ev-v').value),c=document.getElementById('ev-c').value;
 if(!n||isNaN(vl)||vl<=0){toast('Preencha nome e valor');return;}
 const v=MD().variaveis.find(x=>x.id===id);if(v){v.nome=n;v.valor=vl;v.categoria=c;}
 closeSh();save();render();toast('Gasto atualizado');}
function delFixa(id){const f=MD().fixas.find(x=>x.id===id);if(!f)return;
 if(!confirm(`Excluir “${f.nome}” de todos os meses?`))return;
 initFixasGlobais();U.fixasGlobais=U.fixasGlobais.filter(t=>t.seriesId!==f.seriesId);
 Object.values(U.months).forEach(md=>{const removidas=(md.fixas||[]).filter(x=>x.seriesId===f.seriesId);removidas.forEach(x=>delete (md.pagos||{})[x.id]);md.fixas=(md.fixas||[]).filter(x=>x.seriesId!==f.seriesId);});
 save();render();toast('Conta fixa excluída de todos os meses');}
function delVar(id){const md=MD(),v=md.variaveis.find(x=>x.id===id);if(!v)return;
 if(!confirm(`Excluir “${v.nome}” somente de ${MN[cM-1].toLowerCase()}?`))return;
 md.variaveis=md.variaveis.filter(x=>x.id!==id);delete md.pagosVar[id];save();render();toast('Gasto excluído deste mês');}
function delCof(id){U.cofrinhos=(U.cofrinhos||[]).filter(c=>c.id!==id);
 Object.values(U.months).forEach(m=>{m.aportes=(m.aportes||[]).filter(a=>a.cofId!==id);});
 save();render();toast('Cofrinho excluído');}
let rz;window.addEventListener('resize',()=>{if(!uid)return;clearTimeout(rz);rz=setTimeout(render,150);});
</script>
