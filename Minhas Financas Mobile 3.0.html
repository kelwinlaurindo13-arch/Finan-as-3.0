<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Finanças">
<meta name="theme-color" content="#0A0A14">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<title>Minhas Finanças</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0A0A14;
  --bg2:#101020;
  --card:rgba(255,255,255,.045);
  --card2:rgba(255,255,255,.028);
  --line:rgba(255,255,255,.08);
  --line2:rgba(255,255,255,.05);
  --txt:#F2F2F7;
  --txt2:#8E8EA0;
  --txt3:#5C5C70;
  --pp:#8B7DD8;
  --pp2:#6C5FC4;
  --pp-deep:#3D3470;
  --gr:#4ECDA4;
  --or:#E5A55C;
  --rd:#E8899A;
  --r:20px;
}
html,body{background:var(--bg);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body{max-width:460px;margin:0 auto;position:relative}
body::before{content:'';position:fixed;top:-20%;left:-30%;width:80%;height:60%;background:radial-gradient(circle,rgba(108,95,196,.16),transparent 68%);pointer-events:none;z-index:0}
body::after{content:'';position:fixed;bottom:-10%;right:-25%;width:70%;height:50%;background:radial-gradient(circle,rgba(78,205,164,.07),transparent 68%);pointer-events:none;z-index:0}

/* AUTH */
#auth{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:28px;position:relative;z-index:2}
.a-mark{font-size:30px;font-weight:800;letter-spacing:-1.2px;margin-bottom:4px}
.a-sub{color:var(--txt3);font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:44px}
.a-card{background:var(--card);border:1px solid var(--line);border-radius:26px;padding:28px 24px;width:100%;max-width:360px;backdrop-filter:blur(24px)}
.a-card h2{font-size:20px;font-weight:700;margin-bottom:4px;letter-spacing:-.4px}
.a-card p{font-size:13px;color:var(--txt2);margin-bottom:22px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:10px;font-weight:700;color:var(--txt3);margin-bottom:7px;text-transform:uppercase;letter-spacing:1px}
.fld input{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;font-size:15px;outline:none;background:rgba(255,255,255,.04);color:var(--txt);transition:.2s}
.fld input:focus{border-color:var(--pp);background:rgba(139,125,216,.08)}
.fld input::placeholder{color:var(--txt3)}
.btn-p{width:100%;padding:15px;background:var(--pp2);color:#fff;border:none;border-radius:14px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px;transition:.2s}
.btn-p:active{transform:scale(.98)}
.btn-p:disabled{opacity:.5}
.a-err{background:rgba(232,137,154,.12);color:var(--rd);padding:11px 14px;border-radius:12px;font-size:12.5px;margin-bottom:14px;border:1px solid rgba(232,137,154,.2);display:none}
.a-sw{text-align:center;margin-top:18px;font-size:13px;color:var(--txt2)}
.a-sw span{color:var(--pp);font-weight:700;cursor:pointer}

/* APP */
#app{display:none;position:relative;z-index:2;padding-bottom:104px}
.hd{padding:calc(env(safe-area-inset-top) + 14px) 20px 12px;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.hd-l .greet{font-size:13px;color:var(--txt2);margin-bottom:1px}
.hd-l .title{font-size:25px;font-weight:800;letter-spacing:-.9px;line-height:1.1}
.hd-r{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-top:4px}
.mnav{display:flex;align-items:center;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px 5px;backdrop-filter:blur(20px)}
.mnav button{background:none;border:none;color:var(--txt2);width:26px;height:28px;font-size:17px;cursor:pointer;border-radius:9px;display:flex;align-items:center;justify-content:center;transition:.15s}
.mnav button:active{background:rgba(255,255,255,.08);color:var(--txt)}
.mnav span{font-size:13.5px;font-weight:700;padding:0 5px;letter-spacing:-.2px;white-space:nowrap}
.ibtn{width:38px;height:38px;border-radius:13px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(20px);flex-shrink:0;transition:.15s}
.ibtn:active{background:rgba(255,255,255,.1)}
.ibtn svg{width:17px;height:17px;stroke:var(--txt2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.wrap{padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:12px;backdrop-filter:blur(20px)}
.c-lbl{font-size:15px;font-weight:700;letter-spacing:-.3px;margin-bottom:14px}

/* HERO */
.hero{background:linear-gradient(150deg,rgba(108,95,196,.20),rgba(255,255,255,.03));border:1px solid rgba(139,125,216,.22);border-radius:24px;padding:20px;margin-bottom:12px;backdrop-filter:blur(24px)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.hero-lbl{font-size:13.5px;color:var(--txt2);margin-bottom:2px}
.hero-val{font-size:40px;font-weight:800;letter-spacing:-2px;line-height:1.05}
.hero-val small{font-size:21px;font-weight:700;letter-spacing:-.5px;opacity:.85}
.hero-chip{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:600;margin-top:11px}
.chip-dn{background:rgba(232,137,154,.14);color:var(--rd)}
.chip-up{background:rgba(78,205,164,.14);color:var(--gr)}
.chip-nt{background:rgba(255,255,255,.06);color:var(--txt2)}
.ring{position:relative;width:104px;height:104px;flex-shrink:0}
.ring svg{transform:rotate(-90deg)}
.ring-in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring-n{font-size:23px;font-weight:800;letter-spacing:-.8px;line-height:1}
.ring-n span{font-size:12px;font-weight:700}
.ring-t{font-size:8.5px;color:var(--txt2);letter-spacing:1.3px;font-weight:700;margin-top:2px}
.pills{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:18px}
.pl{background:rgba(255,255,255,.05);border:1px solid var(--line2);border-radius:14px;padding:10px 11px}
.pl.hl{background:rgba(78,205,164,.09);border-color:rgba(78,205,164,.22)}
.pl-l{font-size:10.5px;color:var(--txt2);margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl.hl .pl-l{color:var(--gr)}
.pl-v{font-size:15px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.pl.hl .pl-v{color:var(--gr)}

/* FALTA PAGAR */
.fp-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:11px}
.fp-t{font-size:15px;font-weight:700;letter-spacing:-.3px}
.fp-v{font-size:16px;font-weight:800;color:var(--or);letter-spacing:-.4px}
.pbar{height:7px;background:rgba(255,255,255,.07);border-radius:10px;overflow:hidden}
.pfill{height:100%;border-radius:10px;transition:width .55s cubic-bezier(.4,0,.2,1)}
.fp-sub{display:flex;justify-content:space-between;margin-top:9px;font-size:11.5px;color:var(--txt3)}

/* PARTNER */
.pt{background:linear-gradient(140deg,rgba(108,95,196,.30),rgba(61,52,112,.18));border:1px solid rgba(139,125,216,.25);border-radius:var(--r);padding:18px;margin-bottom:12px;position:relative;overflow:hidden;cursor:pointer;backdrop-filter:blur(20px)}
.pt::after{content:'';position:absolute;top:-40px;right:-40px;width:130px;height:130px;background:rgba(255,255,255,.045);border-radius:50%}
.pt-tag{font-size:10px;font-weight:800;letter-spacing:1.4px;color:rgba(255,255,255,.62);text-transform:uppercase;display:flex;align-items:center;gap:7px;margin-bottom:9px}
.pt-tag::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--gr);box-shadow:0 0 8px var(--gr)}
.pt-h{font-size:16.5px;font-weight:700;letter-spacing:-.4px;margin-bottom:14px;line-height:1.35;position:relative}
.pt-g{display:flex;gap:30px;position:relative}
.pt-l{font-size:11px;color:rgba(255,255,255,.55);margin-bottom:2px}
.pt-v{font-size:17px;font-weight:800;letter-spacing:-.5px}
.pt-b{display:inline-block;background:rgba(232,137,154,.2);border:1px solid rgba(232,137,154,.22);border-radius:20px;padding:5px 13px;font-size:11.5px;color:#F0A8B5;margin-top:13px;position:relative}
.pt-r{background:rgba(255,255,255,.1);border:1px solid var(--line);border-radius:11px;color:#fff;font-size:11.5px;font-weight:700;padding:7px 14px;cursor:pointer;margin-top:13px;margin-left:8px;position:relative}

/* STATS */
.sg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:15px;backdrop-filter:blur(20px)}
.st svg{width:20px;height:20px;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;margin-bottom:11px;display:block}
.st-l{font-size:11.5px;color:var(--txt2);margin-bottom:3px}
.st-v{font-size:19px;font-weight:800;letter-spacing:-.6px}
.st-x{font-size:11.5px;color:var(--txt3);margin-top:2px;line-height:1.3}

/* SEGMENT */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:15px;padding:4px;margin-bottom:14px;backdrop-filter:blur(20px)}
.seg button{flex:1;padding:10px;background:none;border:none;color:var(--txt2);font-size:13.5px;font-weight:600;border-radius:11px;cursor:pointer;transition:.2s}
.seg button.on{background:rgba(139,125,216,.26);color:var(--txt);font-weight:700}

/* RESTA CARD */
.rst{border-radius:var(--r);padding:18px;margin-bottom:12px;border:1px solid}
.rst-pp{background:linear-gradient(140deg,rgba(108,95,196,.26),rgba(255,255,255,.03));border-color:rgba(139,125,216,.25)}
.rst-or{background:linear-gradient(140deg,rgba(229,165,92,.18),rgba(255,255,255,.03));border-color:rgba(229,165,92,.2)}
.rst-hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.rst-l{font-size:13.5px;color:var(--txt2)}
.rst-p{font-size:12.5px;color:var(--txt2)}
.rst-v{font-size:32px;font-weight:800;letter-spacing:-1.4px;margin-bottom:14px}
.rst-s{display:flex;justify-content:space-between;margin-top:9px;font-size:11.5px;color:var(--txt3)}

/* LIST */
.lst{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px;backdrop-filter:blur(20px)}
.li{display:flex;align-items:center;gap:13px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:none}
.ck{width:27px;height:27px;border-radius:9px;border:1.6px solid rgba(255,255,255,.18);background:none;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.2s}
.ck.on{background:rgba(78,205,164,.2);border-color:var(--gr)}
.ck svg{width:14px;height:14px;stroke:var(--gr);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transition:.2s}
.ck.on svg{opacity:1}
.li-i{flex:1;min-width:0}
.li-n{font-size:15px;font-weight:600;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li.pd .li-n{text-decoration:line-through;color:var(--txt3);font-weight:500}
.li-s{font-size:11.5px;color:var(--txt3);margin-top:1px}
.li-v{font-size:15px;font-weight:800;letter-spacing:-.4px;white-space:nowrap}
.li.pd .li-v{color:var(--txt3);font-weight:600}
.ed{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid var(--line2);cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.15s}
.ed:active{background:rgba(255,255,255,.12)}
.ed svg{width:14px;height:14px;stroke:var(--txt2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* CAT GROUP */
.cg{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:12px;backdrop-filter:blur(20px)}
.cg-h{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid var(--line2)}
.cg-d{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.cg-n{font-size:14.5px;font-weight:700;letter-spacing:-.2px}
.cg-t{margin-left:auto;font-size:14.5px;font-weight:800;letter-spacing:-.3px}

/* COFRE */
.cf{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;margin-bottom:11px;backdrop-filter:blur(20px)}
.cf-t{display:flex;gap:15px;align-items:center;margin-bottom:14px}
.cr{width:56px;height:56px;position:relative;flex-shrink:0}
.cr svg{transform:rotate(-90deg)}
.cr-n{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;letter-spacing:-.4px}
.cf-i{flex:1;min-width:0}
.cf-n{font-size:16.5px;font-weight:700;letter-spacing:-.4px;margin-bottom:3px}
.cf-s{font-size:13px;color:var(--txt2)}
.cf-p{font-size:12.5px;color:var(--gr);margin-top:2px}
.cf-b{display:flex;gap:9px}
.cf-b button{padding:11px;border-radius:13px;font-size:13.5px;font-weight:700;cursor:pointer;border:1px solid;transition:.15s}
.cf-g{flex:1;background:rgba(139,125,216,.14);border-color:rgba(139,125,216,.3);color:#B5A8F0}
.cf-x{background:rgba(255,255,255,.03);border-color:var(--line);color:var(--txt2);padding-left:20px;padding-right:20px}

/* ANALITICO */
.ins{background:linear-gradient(145deg,rgba(108,95,196,.20),rgba(255,255,255,.025));border:1px solid rgba(139,125,216,.24);border-radius:var(--r);padding:19px;margin-bottom:12px;backdrop-filter:blur(20px)}
.ins-t{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--pp);text-transform:uppercase;display:flex;align-items:center;gap:8px;margin-bottom:14px}
.ins-t svg{width:14px;height:14px;stroke:var(--pp);fill:none;stroke-width:1.8;stroke-linecap:round}
.ins-h{font-size:20px;font-weight:700;letter-spacing:-.6px;line-height:1.4}
.ins-d{height:1px;background:var(--line);margin:16px 0}
.ins-b{font-size:14px;color:var(--txt2);line-height:1.65}
.ins-b b{color:var(--txt);font-weight:700}

.hbar{display:flex;gap:3px;height:44px;margin-bottom:14px}
.hseg{border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:rgba(0,0,0,.55);min-width:6px;transition:.4s}
.hleg{display:grid;grid-template-columns:1fr 1fr;gap:9px 14px}
.hl-i{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt2)}
.hl-d{width:9px;height:9px;border-radius:3px;flex-shrink:0}

.dn-w{display:flex;align-items:center;gap:18px}
.dn-c{position:relative;width:132px;height:132px;flex-shrink:0}
.dn-i{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dn-t{font-size:9px;color:var(--txt3);letter-spacing:1.4px;font-weight:700}
.dn-v{font-size:17px;font-weight:800;letter-spacing:-.6px;margin-top:2px}
.dn-l{flex:1;display:flex;flex-direction:column;gap:11px;min-width:0}
.dn-r{display:flex;align-items:center;gap:9px;font-size:13.5px}
.dn-d{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.dn-nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--txt)}
.dn-pc{font-weight:700;font-size:13px;color:var(--txt2);white-space:nowrap}
.dn-pc.up{color:var(--rd)}
.dn-pc.dw{color:var(--gr)}

/* EMPTY */
.emp{text-align:center;padding:44px 22px;color:var(--txt3);font-size:14px;line-height:1.7}
.emp svg{width:34px;height:34px;stroke:var(--txt3);fill:none;stroke-width:1.4;margin-bottom:14px;opacity:.5}

/* FAB */
.fab{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 96px);right:20px;width:54px;height:54px;border-radius:19px;background:linear-gradient(140deg,var(--pp),var(--pp2));border:none;color:#fff;font-size:27px;font-weight:300;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 10px 30px rgba(108,95,196,.42);z-index:60;transition:.18s}
.fab:active{transform:scale(.92)}

/* NAV */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:460px;background:rgba(12,12,22,.82);backdrop-filter:blur(30px) saturate(180%);border-top:1px solid var(--line);display:flex;padding:9px 10px calc(env(safe-area-inset-bottom) + 9px);z-index:70;gap:3px}
.nv{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;padding:9px 3px;background:none;border:none;color:var(--txt3);font-size:10px;font-weight:600;cursor:pointer;border-radius:15px;transition:.2s}
.nv.on{background:rgba(139,125,216,.2);color:#B5A8F0}
.nv svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* SHEET */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.68);backdrop-filter:blur(6px);z-index:200;display:none}
.ov.on{display:block}
.sh{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(100%);width:100%;max-width:460px;background:#14141F;border:1px solid var(--line);border-bottom:none;border-radius:28px 28px 0 0;z-index:201;padding:0 22px calc(env(safe-area-inset-bottom) + 32px);transition:transform .38s cubic-bezier(.32,.72,0,1);max-height:88vh;overflow-y:auto}
.sh.on{transform:translateX(-50%) translateY(0)}
.sh-g{width:38px;height:4px;background:rgba(255,255,255,.16);border-radius:3px;margin:11px auto 20px}
.sh-t{font-size:20px;font-weight:800;letter-spacing:-.6px;margin-bottom:20px}
.sf{margin-bottom:14px}
.sf label{display:block;font-size:10px;font-weight:700;color:var(--txt3);margin-bottom:7px;text-transform:uppercase;letter-spacing:1px}
.sf input,.sf select{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:14px;font-size:15px;outline:none;background:rgba(255,255,255,.04);color:var(--txt);appearance:none}
.sf input:focus,.sf select:focus{border-color:var(--pp);background:rgba(139,125,216,.08)}
.sf input::placeholder{color:var(--txt3)}
.sf select option{background:#1A1A28;color:var(--txt)}
.sh-b{width:100%;padding:16px;background:var(--pp2);color:#fff;border:none;border-radius:15px;font-size:15px;font-weight:700;cursor:pointer;margin-top:6px}
.sh-d{width:100%;padding:15px;background:rgba(232,137,154,.1);color:var(--rd);border:1px solid rgba(232,137,154,.2);border-radius:15px;font-size:14px;font-weight:700;cursor:pointer;margin-top:11px}
.uid{background:rgba(139,125,216,.1);border:1px solid rgba(139,125,216,.2);border-radius:14px;padding:13px 15px;font-size:11.5px;color:var(--pp);margin-bottom:16px;word-break:break-all;line-height:1.5}
.uid b{color:#B5A8F0;font-size:11px}

.tst{position:fixed;bottom:130px;left:50%;transform:translateX(-50%) translateY(8px);background:rgba(30,30,45,.96);border:1px solid var(--line);backdrop-filter:blur(20px);color:var(--txt);padding:12px 22px;border-radius:16px;font-size:13.5px;font-weight:600;z-index:400;opacity:0;transition:.28s;pointer-events:none;white-space:nowrap}
.tst.on{opacity:1;transform:translateX(-50%) translateY(0)}

/* DESKTOP */
@media(min-width:960px){
  body{max-width:100%}
  #app{padding-bottom:0;display:none}
  #app.dtk{display:block}
  #app.dtk .nav{display:none}
  #app.dtk .fab{right:calc(320px + 24px);bottom:28px}
  .dtk-shell{display:grid;grid-template-columns:224px 1fr;min-height:100vh}
  .side{position:fixed;top:0;left:0;width:224px;height:100vh;border-right:1px solid var(--line);padding:28px 14px calc(env(safe-area-inset-bottom) + 20px);display:flex;flex-direction:column;background:rgba(12,12,22,.5);backdrop-filter:blur(24px);z-index:50}
  .side-b{font-size:17px;font-weight:800;letter-spacing:-.5px;padding:0 10px 4px}

/* ── VIEW: COFRINHOS ── */
function vCofres(md){
 const cfs=U.cofrinhos||[];
 if(!cfs.length)return`<div class="lst"><div class="emp">${svg(I.gift)}Nenhum cofrinho ainda.<br>Toque no + para criar seu primeiro objetivo.</div></div>`;
 const ap={};md.aportes.forEach(a=>{ap[a.cofId]=(ap[a.cofId]||0)+Number(a.valor);});
 const totG=cfs.reduce((s,c)=>s+totalCof(c.id),0);
 const mesG=md.aportes.reduce((s,a)=>s+Number(a.valor),0);
 // projeção reserva
 let proj='';
 if(mesG>0){const alvo=cfs.reduce((b,c)=>{const t=totalCof(c.id);const falta=Number(c.meta)-t;return(falta>0&&(!b||falta<b.falta))?{c,falta}:b;},null);
  if(alvo){const ms=Math.ceil(alvo.falta/mesG);proj=`No ritmo de ${MN[cM-1].toLowerCase()} (${fmtS(mesG)}/mês), <b style="color:var(--gr)">${esc(alvo.c.nome)}</b> fecha em <b style="color:var(--gr)">${ms} ${ms===1?'mês':'meses'}</b>.`;}}
 else proj='Guarde algo esse mês para ver a projeção de quando cada meta fecha.';
 return`
 <div class="card" style="background:linear-gradient(140deg,rgba(78,205,164,.13),rgba(255,255,255,.03));border-color:rgba(78,205,164,.2)">

 </div>
 ${cfs.map(c=>{const t=totalCof(c.id),pct=c.meta>0?Math.min(100,Math.round(t/c.meta*100)):0;
  const R=24,CC=2*Math.PI*R;const falta=Number(c.meta)-t;
  const ms=mesG>0&&falta>0?Math.ceil(falta/mesG):0;
  return`<div class="cf">
   <div class="cf-t">
    <div class="cr"><svg width="56" height="56">
      <circle cx="28" cy="28" r="${R}" stroke="rgba(255,255,255,.08)" stroke-width="5" fill="none"/>
      <circle cx="28" cy="28" r="${R}" stroke="var(--gr)" stroke-width="5" fill="none" stroke-linecap="round" stroke-dasharray="${CC}" stroke-dashoffset="${CC*(1-pct/100)}"/>
     </svg><div class="cr-n">${pct}%</div></div>
    <div class="cf-i">
     <div class="cf-n">${esc(c.nome)}</div>
     <div class="cf-s">${hv(t)} de ${hv(c.meta)}</div>
     ${pct>=100?`<div class="cf-p">Meta batida! 🎉</div>`:ms?`<div class="cf-p">faltam ${ms} ${ms===1?'mês':'meses'} no ritmo atual</div>`:''}
    </div>
   </div>
   <div class="cf-b"><button class="cf-g" onclick="openAp('${c.id}')">Guardar aqui</button><button class="cf-x" onclick="delCof('${c.id}')">Excluir</button></div>
  </div>`;}).join('')}`;
}
function totalCof(id){let t=Number((U.cofrinhos.find(c=>c.id===id)||{}).total||0);
 Object.values(U.months).forEach(m=>(m.aportes||[]).forEach(a=>{if(a.cofId===id)t+=Number(a.valor);}));return t;}

      <div style="height:${a.fT/mx*104}px;background:#8B7DD8"></div>
      <div style="height:${a.vT/mx*104}px;background:#E5A55C"></div>
      <div style="height:${a.aT/mx*104}px;background:#4ECDA4"></div>
     </div>
     <span style="font-size:9px;color:${i+1===cM?'var(--pp)':'var(--txt3)'};font-weight:${i+1===cM?800:600}">${MS[i]}</span>
    </div>`).join('');})()}
  </div>
  <div class="hleg"><div class="hl-i"><span class="hl-d" style="background:#8B7DD8"></span>Fixas</div><div class="hl-i"><span class="hl-d" style="background:#E5A55C"></span>Variáveis</div><div class="hl-i"><span class="hl-d" style="background:#4ECDA4"></span>Guardado</div></div>
 </div>`:''}`;
}
function catData(anual,m,y){
 const cats={};
 const proc=md=>{
  (md.variaveis||[]).forEach(v=>{const c=catVar(v.nome,v.categoria);cats[c]=(cats[c]||0)+Number(v.valor);});
  (md.fixas||[]).forEach(f=>{const g=grpFixa(f.nome);cats[g]=(cats[g]||0)+Number(f.valor);});
  const a=(md.aportes||[]).reduce((s,x)=>s+Number(x.valor),0);if(a>0)cats['Cofrinhos']=(cats['Cofrinhos']||0)+a;
 };
 if(anual){for(let i=1;i<=12;i++){const d=U.months[key(cY,i)];if(d)proc(d);}}
 else{const d=U.months[key(y||cY,m||cM)];if(d)proc(d);}
 return cats;
}
function drawDonut(){
 const el=document.getElementById('dn');if(!el)return;
 const tot=_dnData.reduce((s,[,v])=>s+v,0)||1;
 const R=52,W=13,cx=66,cy=66,C=2*Math.PI*R;
 let off=0,h='';
 h+=`<circle cx="${cx}" cy="${cy}" r="${R}" stroke="rgba(255,255,255,.05)" stroke-width="${W}" fill="none"/>`;
 _dnData.forEach(([k,v])=>{const frac=v/tot;
  h+=`<circle cx="${cx}" cy="${cy}" r="${R}" stroke="${col(k)}" stroke-width="${W}" fill="none" stroke-dasharray="${frac*C-2.5} ${C}" stroke-dashoffset="${-off*C}" transform="rotate(-90 ${cx} ${cy})" stroke-linecap="round"/>`;
  off+=frac;});
 el.innerHTML=h;
}

/* ── PARCEIRO ── */
async function fetchP(){
 if(!U.spouseUid)return;toast('Atualizando...');
 try{const s=await db.collection('users').doc(U.spouseUid).get();pData=s.exists?s.data():null;render();toast(pData?'Dados atualizados':'Usuário não encontrado');}
 catch(e){console.error(e);toast('Erro ao atualizar');}
}
function openPartner(){
 if(!pData){toast('Toque em Atualizar primeiro');return;}
 const md=(pData.months||{})[key()]||{},c=calc(md,pData.salario||0);
 const nm=U.spouseName||'Parceiro(a)';
 document.getElementById('pt-tt').textContent='Finanças da '+nm;
 let h=`<div class="sg" style="grid-template-columns:1fr 1fr;margin-bottom:14px">
  <div class="st"><div class="st-l">Saldo</div><div class="st-v">${fmt(c.saldo)}</div></div>
  <div class="st"><div class="st-l">Gastos</div><div class="st-v">${fmt(c.tot)}</div></div></div>`;
 if((md.fixas||[]).length){h+=`<div class="c-lbl" style="margin-top:8px">Contas fixas</div><div class="lst">`;
  md.fixas.forEach(f=>{const p=!!(md.pagos||{})[f.id];
   h+=`<div class="li ${p?'pd':''}"><div class="ck ${p?'on':''}" style="cursor:default">${svg(I.chk)}</div><div class="li-i"><div class="li-n">${esc(f.nome)}</div><div class="li-s">${p?'Pago':'Ainda não pago'}</div></div><div class="li-v">${fmt(f.valor)}</div></div>`;});
  h+=`</div>`;}
 if((md.variaveis||[]).length){h+=`<div class="c-lbl" style="margin-top:8px">Variáveis</div><div class="lst">`;
  md.variaveis.forEach(v=>{const p=!!(md.pagosVar||{})[v.id];
   h+=`<div class="li ${p?'pd':''}"><div class="ck ${p?'on':''}" style="cursor:default">${svg(I.chk)}</div><div class="li-i"><div class="li-n">${esc(v.nome)}</div><div class="li-s">${esc(v.categoria||'Outros')}</div></div><div class="li-v">${fmt(v.valor)}</div></div>`;});
  h+=`</div>`;}
 document.getElementById('pt-bd').innerHTML=h;openSh('sh-pt');
}

/* ── AÇÕES ── */
function go(t){tab=t;render();window.scrollTo(0,0);}
function chM(d){let y=cY,m=cM+d;if(m>12){m=1;y++;}if(m<1){m=12;y--;}if(y<MIN_Y||(y===MIN_Y&&m<MIN_M))return;cY=y;cM=m;propag();render();}
function setF(f){aFilt=f;render();setTimeout(drawDonut,10);}
function toggleHide(){hide=!hide;render();}
function openSh(id){document.getElementById('ov').classList.add('on');document.getElementById(id).classList.add('on');}
function closeSh(){document.getElementById('ov').classList.remove('on');document.querySelectorAll('.sh').forEach(s=>s.classList.remove('on'));}
function openCfg(){
 document.getElementById('cg-nm').value=U.nome||'';
 document.getElementById('cg-sl').value=U.salario||'';
 document.getElementById('cg-sp').value=U.spouseUid||'';
 document.getElementById('cg-sn').value=U.spouseName===('Parceiro(a)')?'':U.spouseName||'';
 document.getElementById('cg-uid').textContent=uid;openSh('sh-cg');}
function saveSettings(){
 U.nome=document.getElementById('cg-nm').value.trim()||U.nome;
 U.salario=parseFloat(document.getElementById('cg-sl').value)||0;
 const ns=document.getElementById('cg-sp').value.trim();
 if(ns!==U.spouseUid)pData=null;
 U.spouseUid=ns;
 U.spouseName=document.getElementById('cg-sn').value.trim()||'Parceiro(a)';
 closeSh();save();render();if(U.spouseUid)fetchP();toast('Configurações salvas');}
function doLogout(){closeSh();auth.signOut();}

function addFixa(){const n=document.getElementById('fx-n').value.trim(),v=parseFloat(document.getElementById('fx-v').value);
 if(!n||isNaN(v)||v<=0){toast('Preencha nome e valor');return;}
 MD();propagNova({id:rid(),nome:n,valor:v});
 document.getElementById('fx-n').value='';document.getElementById('fx-v').value='';
 closeSh();save();render();toast('Conta adicionada');}
function addVar(){const n=document.getElementById('vr-n').value.trim(),v=parseFloat(document.getElementById('vr-v').value),c=document.getElementById('vr-c').value;
 if(!n||isNaN(v)||v<=0){toast('Preencha nome e valor');return;}
 MD().variaveis.push({id:rid(),nome:n,valor:v,categoria:catVar(n,c)});
 document.getElementById('vr-n').value='';document.getElementById('vr-v').value='';
 closeSh();save();render();toast('Gasto adicionado');}
function addCofre(){const n=document.getElementById('cf-n').value.trim(),m=parseFloat(document.getElementById('cf-m').value);
 if(!n||isNaN(m)||m<=0){toast('Preencha nome e meta');return;}
 U.cofrinhos=U.cofrinhos||[];U.cofrinhos.push({id:rid(),nome:n,meta:m,total:0});
 document.getElementById('cf-n').value='';document.getElementById('cf-m').value='';
 closeSh();save();render();toast('Cofrinho criado');}
function openAp(id){document.getElementById('ap-id').value=id;openSh('sh-ap');}
function addAporte(){const id=document.getElementById('ap-id').value,n=document.getElementById('ap-n').value.trim(),v=parseFloat(document.getElementById('ap-v').value);
 if(!n||isNaN(v)||v<=0){toast('Preencha descrição e valor');return;}
 MD().aportes.push({id:rid(),cofId:id,nome:n,valor:v});
 document.getElementById('ap-n').value='';document.getElementById('ap-v').value='';
 closeSh();save();render();toast('Dinheiro guardado');}
function addExtra(){const n=document.getElementById('ex-n').value.trim(),v=parseFloat(document.getElementById('ex-v').value);
 if(!n||isNaN(v)||v<=0){toast('Preencha descrição e valor');return;}
 MD().extras.push({id:rid(),nome:n,valor:v});
 document.getElementById('ex-n').value='';document.getElementById('ex-v').value='';
 closeSh();save();render();toast('Renda extra adicionada');}
function togF(id){const md=MD();md.pagos[id]=!md.pagos[id];save();render();}
function togV(id){const md=MD();md.pagosVar[id]=!md.pagosVar[id];save();render();}
function editF(id){const f=MD().fixas.find(x=>x.id===id);if(!f)return;
 document.getElementById('ef-id').value=id;document.getElementById('ef-n').value=f.nome;document.getElementById('ef-v').value=f.valor;openSh('sh-ef');}
function saveEditFixa(){const id=document.getElementById('ef-id').value,n=document.getElementById('ef-n').value.trim(),v=parseFloat(document.getElementById('ef-v').value);
 if(!n||isNaN(v)||v<=0){toast('Preencha nome e valor');return;}
 const old=(MD().fixas.find(x=>x.id===id)||{}).nome,ts=cY*100+cM;
 Object.keys(U.months).forEach(k=>{const[y,m]=k.split('-').map(Number);
  if(y*100+m>=ts){const f=(U.months[k].fixas||[]).find(x=>x.nome===old||x.id===id);if(f){f.nome=n;f.valor=v;}}});
 closeSh();save();render();toast('Conta atualizada');}
function editV(id){const v=MD().variaveis.find(x=>x.id===id);if(!v)return;
 document.getElementById('ev-id').value=id;document.getElementById('ev-n').value=v.nome;document.getElementById('ev-v').value=v.valor;document.getElementById('ev-c').value=v.categoria||'Outros';openSh('sh-ev');}
function saveEditVar(){const id=document.getElementById('ev-id').value,n=document.getElementById('ev-n').value.trim(),vl=parseFloat(document.getElementById('ev-v').value),c=document.getElementById('ev-c').value;
 if(!n||isNaN(vl)||vl<=0){toast('Preencha nome e valor');return;}
 const v=MD().variaveis.find(x=>x.id===id);if(v){v.nome=n;v.valor=vl;v.categoria=c;}
 closeSh();save();render();toast('Gasto atualizado');}
function delCof(id){U.cofrinhos=(U.cofrinhos||[]).filter(c=>c.id!==id);
 Object.values(U.months).forEach(m=>{m.aportes=(m.aportes||[]).filter(a=>a.cofId!==id);});
 save();render();toast('Cofrinho excluído');}

let rz;window.addEventListener('resize',()=>{if(!uid)return;clearTimeout(rz);rz=setTimeout(render,150);});
</script>
